name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="1.0.0"; fi
          echo "PHOTOLIZ_VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "PHOTOLIZ_VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "ARTIFACT_VERSION=$V-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Release keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK and run unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease testDebugUnitTest

      - name: Lint (report only)
        continue-on-error: true
        run: ./gradlew --no-daemon lintDebug

      - name: Collect APK
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$APK" "$GITHUB_WORKSPACE/dist/Photoliz-$ARTIFACT_VERSION.apk"
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::No release keystore secrets: the APK is signed with this runner's debug key. It installs fine, but updating over a build from another run needs an uninstall first."
          fi
          ls -l "$GITHUB_WORKSPACE/dist"

      - uses: actions/upload-artifact@v7
        with:
          name: photoliz-android
          path: dist/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports-android
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: ignore

  ios:
    name: iOS IPA (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Main build with the current App Store SDK; the deployment target stays iOS 13.0.
          - label: xcode26
            runner: macos-26
            xcode: /Applications/Xcode.app
            minos: ''
            primary: true
          # Xcode 16.4 officially supports deploying to iOS 13: the safe IPA for iOS 13 and 14 devices.
          - label: xcode16-ios13
            runner: macos-15
            xcode: /Applications/Xcode_16.4.app
            minos: '13.0'
            primary: false
    env:
      IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      IOS_CODE_SIGN_IDENTITY: ${{ secrets.IOS_CODE_SIGN_IDENTITY }}
      IOS_EXPORT_METHOD: ${{ secrets.IOS_EXPORT_METHOD }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/ios-archive
        with:
          xcode: ${{ matrix.xcode }}
          label: ${{ matrix.label }}
          require-minos: ${{ matrix.minos }}

      - name: Signed IPA (only when signing secrets are set)
        if: matrix.primary && env.IOS_CERTIFICATE_P12_BASE64 != '' && env.IOS_PROVISIONING_PROFILE_BASE64 != ''
        working-directory: ios
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$IOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          PROFILE="$RUNNER_TEMP/profile.mobileprovision"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE"
          security cms -D -i "$PROFILE" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/profile.plist")
          TEAM="${IOS_TEAM_ID:-$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" "$RUNNER_TEMP/profile.plist")}"
          for DIR in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$DIR"
            cp "$PROFILE" "$DIR/$UUID.mobileprovision"
          done
          IDENTITY="${IOS_CODE_SIGN_IDENTITY:-Apple Distribution}"
          METHOD="${IOS_EXPORT_METHOD:-release-testing}"

          xcodebuild archive \
            -project Photoliz.xcodeproj \
            -scheme Photoliz \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Signed.xcarchive" \
            MARKETING_VERSION="$VERSION_NAME" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM" \
            CODE_SIGN_IDENTITY="$IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$UUID" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN" \
            -quiet

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>$METHOD</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>$IDENTITY</string>
            <key>provisioningProfiles</key>
            <dict><key>dev.panasko.photoliz</key><string>$UUID</string></dict>
            <key>stripSwiftSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Signed.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"
          cp "$RUNNER_TEMP"/export/*.ipa "$GITHUB_WORKSPACE/dist/Photoliz-$ARTIFACT_VERSION-signed.ipa"
          security delete-keychain "$KEYCHAIN" || true
          ls -l "$GITHUB_WORKSPACE/dist"

      - uses: actions/upload-artifact@v7
        with:
          name: photoliz-ios-${{ matrix.label }}
          path: dist/*.ipa
          if-no-files-found: error

  # Forward-compatibility check against the iOS 27 SDK. The runner image is a public preview, so this job
  # never blocks the other builds or a release.
  ios-xcode27:
    name: iOS IPA (xcode27, preview)
    runs-on: xcode-27
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/ios-archive
        with:
          xcode: /Applications/Xcode.app
          label: xcode27

      - uses: actions/upload-artifact@v7
        with:
          name: preview-ios-xcode27
          path: dist/*.ipa
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: photoliz-*
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/*.apk dist/*.ipa \
            --repo "$GITHUB_REPOSITORY" \
            --title "Photoliz $GITHUB_REF_NAME" \
            --generate-notes
